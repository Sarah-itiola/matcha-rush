<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matcha Rush</title>

    <link rel="stylesheet" href="css/index.css">

    <script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
</head>

<body>

    <header class="game-header">
        <h1>Matcha Rush ♡</h1>
        <p>Collect the good stuff, avoid the chaos.</p>
    </header>

    <main class="game-layout">

        <section class="game">

            <section class="score">
                <p>Score</p>
                <strong id="score">0 ♡</strong>

                <p>High score</p>
                <span id="high-score">0</span>

                <p>Last score</p>
                <span id="last-score">0</span>
            </section>

            <section id="game-container"></section>

        </section>

        <aside class="instructions">

            <h2>How to play ♡</h2>

            <section class="instruction">
                <span>← →</span>
                <p>Move left and right</p>
            </section>

            <section class="instruction">
                <span>🍓</span>
                <p>Catch ingredients for points</p>
            </section>

            <section class="instruction">
    <span>☕</span>
    <p>Avoid the coffee!</p>
</section>

            <section class="instruction">
                <span>R</span>
                <p>Restart the game</p>
            </section>

            <p class="message">Build your perfect matcha ♡</p>

        </aside>

    </main>

    <footer>
        <p>Made with matcha & code ♡</p>
    </footer>

    <script src="index.js"></script>

</body>

</html>
